<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Мое Облако - KRSU</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #F5F5F7; color: #1D1D1F; margin: 0; padding: 0; min-height: 100vh; }
        
        /* ── ЭКРАН БЛОКИРОВКИ ── */
        #lock-screen { position: fixed; inset: 0; background: #F5F5F7; z-index: 9999; display: flex; align-items: center; justify-content: center; flex-direction: column; cursor: pointer; }
        .lock-container { text-align: center; padding: 20px; transition: transform 0.3s; }
        .lock-title { color: #1D1D1F; font-size: 24px; margin-bottom: 30px; font-weight: 600; letter-spacing: 0.5px; }
        .pin-display { display: flex; gap: 20px; justify-content: center; margin-bottom: 20px; }
        .pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #D1D1D6; background: transparent; transition: all 0.15s ease-in-out; }
        .pin-dot.filled { background: #1D1D1F; border-color: #1D1D1F; }
        .pin-dot.error { background: #FF3B30 !important; border-color: #FF3B30 !important; }
        
        /* Скрытое поле ввода для клавиатуры */
        #hidden-pin { position: absolute; opacity: 0; z-index: -1; font-size: 16px; top: 0; left: 0; pointer-events: none; }
        
        /* Анимация ошибки */
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-12px); }
            40%, 80% { transform: translateX(12px); }
        }

        /* ── ОСНОВНОЙ ИНТЕРФЕЙС ── */
        #app-content { padding: 40px 20px; display: none; }
        .container { max-width: 1000px; margin: 0 auto; background: #FFFFFF; padding: 30px; border-radius: 20px; box-shadow: 0 8px 24px rgba(0,0,0,0.04); }
        
        .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
        h1 { color: #1D1D1F; font-size: 26px; margin: 0; font-weight: 700; }
        .repo-badge { background: #F2F2F7; color: #6E7076; padding: 8px 14px; border-radius: 10px; font-size: 14px; font-weight: 600; }
        
        .search-container { margin-bottom: 25px; }
        .search-bar { width: 100%; padding: 14px 20px; border-radius: 12px; border: 2px solid #F2F2F7; background: #F9F9FB; font-size: 15px; outline: none; transition: all 0.2s ease; }
        .search-bar:focus { border-color: #0A84FF; background: #FFFFFF; box-shadow: 0 0 0 4px rgba(10, 132, 255, 0.1); }
        .search-bar::placeholder { color: #8E8E93; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px; background: #F9F9FB; padding: 12px 20px; border-radius: 14px; }
        .breadcrumbs { font-size: 15px; font-weight: 600; color: #0A84FF; display: flex; align-items: center; gap: 6px; flex: 1; flex-wrap: wrap; }
        .breadcrumb-item { cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: background 0.2s; }
        .breadcrumb-item:hover { background: #E5E5EA; }
        .separator { color: #8E8E93; }
        
        .view-toggle { display: flex; background: #E5E5EA; border-radius: 10px; padding: 3px; }
        .view-btn { background: transparent; border: none; padding: 8px 16px; cursor: pointer; color: #6E7076; font-weight: 600; font-size: 14px; border-radius: 8px; transition: all 0.2s; }
        .view-btn.active { background: #FFFFFF; color: #1D1D1F; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        
        .file-container { display: flex; gap: 16px; }
        
        /* РЕЖИМ СЕТКИ */
        .file-container.grid-view { flex-direction: row; flex-wrap: wrap; }
        .grid-view .file-item { display: flex; flex-direction: column; align-items: center; justify-content: center; width: calc(25% - 12px); padding: 30px 15px 55px 15px; background: #FFFFFF; border: 1px solid #E5E5EA; border-radius: 16px; cursor: pointer; transition: all 0.2s ease; text-align: center; position: relative; }
        @media (max-width: 850px) { .grid-view .file-item { width: calc(33.33% - 11px); } }
        @media (max-width: 550px) { .grid-view .file-item { width: calc(50% - 8px); } }
        
        .grid-view .file-item:hover { border-color: #0A84FF; box-shadow: 0 8px 24px rgba(10, 132, 255, 0.12); transform: translateY(-3px); }
        .grid-view .file-icon { font-size: 48px; margin-bottom: 15px; }
        .grid-view .file-name { font-weight: 600; font-size: 14px; word-break: break-word; line-height: 1.4; color: #1D1D1F; margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .grid-view .file-size { color: #8E8E93; font-size: 13px; font-weight: 500; margin-bottom: 0; }
        
        .grid-view .action-buttons { opacity: 0; transform: translateY(10px); position: absolute; bottom: 12px; width: calc(100% - 24px); left: 12px; display: flex; transition: all 0.2s ease; }
        .grid-view .file-item:hover .action-buttons { opacity: 1; transform: translateY(0); }
        .grid-view .action-buttons .primary-btn { flex: 1; padding: 8px 2px; font-size: 13px; text-align: center; }
        .grid-view .file-item.is-dir .action-buttons { display: none; }

        /* РЕЖИМ СПИСКА */
        .file-container.list-view { flex-direction: column; gap: 8px; }
        .list-view .file-item { display: flex; justify-content: space-between; padding: 14px 20px; background: #FFFFFF; border: 1px solid #E5E5EA; align-items: center; transition: 0.2s; cursor: pointer; border-radius: 12px; }
        .list-view .file-item:hover { border-color: #0A84FF; background-color: #F8F9FA; }
        .list-view .file-name { font-weight: 600; display: flex; align-items: center; gap: 15px; font-size: 15px; color: #1D1D1F; }
        .list-view .file-icon { font-size: 24px; }
        .list-view .file-actions { display: flex; align-items: center; gap: 20px; }
        .list-view .file-size { color: #8E8E93; font-size: 14px; font-weight: 500; min-width: 80px; text-align: right; }
        .list-view .action-buttons { display: flex; align-items: center; }

        .primary-btn { background: #0A84FF; color: #FFF; border: none; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 700; transition: all 0.2s; cursor: pointer; outline: none; }
        .primary-btn:hover { background: #0B6FE0; box-shadow: 0 4px 12px rgba(10, 132, 255, 0.3); }
        
        .empty-state { text-align: center; color: #8E8E93; padding: 60px 0; width: 100%; font-size: 16px; font-weight: 500; }

        /* Модальное окно предпросмотра */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 100; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: #FFFFFF; border-radius: 20px; padding: 25px; max-width: 850px; width: 100%; max-height: 90vh; overflow-y: auto; position: relative; display: flex; flex-direction: column; align-items: center; box-shadow: 0 20px 60px rgba(0,0,0,0.2); }
        .close-btn { position: absolute; top: 20px; right: 25px; font-size: 28px; cursor: pointer; color: #8E8E93; background: none; border: none; font-weight: bold; transition: color 0.2s; }
        .close-btn:hover { color: #FF3B30; }
        .preview-box { margin-top: 20px; width: 100%; text-align: center; }
        .preview-box img, .preview-box video { max-width: 100%; max-height: 60vh; border-radius: 12px; box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
        .preview-box pre { text-align: left; background: #F9F9FB; padding: 20px; border-radius: 12px; border: 1px solid #E5E5EA; overflow-x: auto; font-size: 14px; max-height: 60vh; white-space: pre-wrap; color: #1D1D1F; }
    </style>
</head>
<body>

    <!-- ── ЭКРАН ПИН-КОДА ── -->
    <div id="lock-screen" onclick="document.getElementById('hidden-pin').focus()">
        <div class="lock-container" id="lock-container">
            <div class="lock-title">Введите ПИН-код</div>
            <div class="pin-display" id="pin-display">
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
                <div class="pin-dot"></div>
            </div>
            <!-- Скрытый инпут для вызова цифровой клавиатуры -->
            <input type="password" inputmode="numeric" pattern="[0-9]*" id="hidden-pin" maxlength="4" autocomplete="off" autofocus>
        </div>
    </div>

    <!-- ── ОСНОВНОЙ КОНТЕНТ (Изначально скрыт) ── -->
    <div id="app-content">
        <div class="container">
            <div class="header">
                <h1>☁️ Мои файлы</h1>
                <span class="repo-badge">7777users / KRSU</span>
            </div>
            
            <div class="search-container">
                <input type="text" id="search-input" class="search-bar" placeholder="Глобальный поиск файлов по всему облаку...">
            </div>

            <div class="toolbar">
                <div class="breadcrumbs" id="breadcrumbs"></div>
                <div class="view-toggle">
                    <button class="view-btn active" onclick="setViewMode('grid')" id="btn-grid">Плитка</button>
                    <button class="view-btn" onclick="setViewMode('list')" id="btn-list">Список</button>
                </div>
            </div>

            <div class="file-container grid-view" id="file-container">
                <div class="empty-state">Подключение к облаку...</div>
            </div>
        </div>
    </div>

    <!-- Модальное окно предпросмотра -->
    <div class="modal" id="preview-modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-btn" onclick="closeModal()">×</button>
            <h2 id="modal-title" style="margin-top:0; font-size:20px; color:#1D1D1F;">Предпросмотр</h2>
            <div id="modal-body" class="preview-box"></div>
            <div style="margin-top: 25px; width: 100%; display: flex; justify-content: center;" id="modal-footer"></div>
        </div>
    </div>

    <script>
        const username = "7777users";
        const rootRepo = "KRSU";
        
        let currentPath = rootRepo; 
        let allFiles = []; 
        let currentViewMode = 'grid'; 
        let searchTimeout;

        // ── ЛОГИКА ЭКРАНА БЛОКИРОВКИ ──
        const hiddenPin = document.getElementById('hidden-pin');
        const dots = document.querySelectorAll('.pin-dot');
        const lockContainer = document.getElementById('lock-container');

        hiddenPin.addEventListener('input', (e) => {
            const val = e.target.value;
            
            // Заполняем кружочки
            dots.forEach((dot, index) => {
                dot.className = 'pin-dot';
                if (index < val.length) dot.classList.add('filled');
            });

            // Если ввели 4 цифры — проверяем
            if (val.length === 4) {
                // Обфускация: XOR операция. (9797 ^ 43981 = 34504)
                if ((parseInt(val, 10) ^ 43981) === 34504) {
                    // Успех! Скрываем блокировку и запускаем загрузку
                    document.getElementById('lock-screen').style.display = 'none';
                    document.getElementById('app-content').style.display = 'block';
                    hiddenPin.blur();
                    loadPath(currentPath); // Теперь можно запрашивать данные
                } else {
                    // Ошибка: Трясем и красим в красный
                    lockContainer.classList.add('shake');
                    dots.forEach(dot => dot.classList.add('error'));
                    hiddenPin.disabled = true; // Блокируем ввод во время анимации
                    
                    setTimeout(() => {
                        lockContainer.classList.remove('shake');
                        dots.forEach(dot => dot.className = 'pin-dot');
                        hiddenPin.value = '';
                        hiddenPin.disabled = false;
                        hiddenPin.focus();
                    }, 400);
                }
            }
        });
        
        // Фокус при клике и при старте
        window.addEventListener('load', () => hiddenPin.focus());


        // ── ОСНОВНАЯ ЛОГИКА ФАЙЛОВОГО МЕНЕДЖЕРА ──
        document.getElementById('search-input').addEventListener('input', (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => handleSearch(e.target.value.trim()), 400); 
        });

        async function loadPath(path) {
            currentPath = path;
            updateBreadcrumbs();
            document.getElementById("file-container").innerHTML = '<div class="empty-state">Загрузка папки...</div>';
            
            const apiUrl = `https://api.github.com/repos/${username}/${rootRepo}/contents/${path}`;
            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error("API Error");
                
                const files = await response.json();
                
                allFiles = files.filter(f => !f.name.startsWith('.')).sort((a, b) => {
                    if (a.type === b.type) return a.name.localeCompare(b.name);
                    return a.type === "dir" ? -1 : 1;
                });
                
                renderFiles(allFiles);
            } catch (error) {
                console.error(error);
                document.getElementById("file-container").innerHTML = '<div class="empty-state">Ошибка доступа или папка пуста.</div>';
            }
        }

        async function handleSearch(query) {
            if (!query) {
                loadPath(currentPath);
                return;
            }
            
            document.getElementById("file-container").innerHTML = '<div class="empty-state">Поиск по всему облаку... 🔍</div>';
            try {
                const res = await fetch(`https://api.github.com/repos/${username}/${rootRepo}/git/trees/main?recursive=1`);
                const data = await res.json();
                
                if (!data.tree) throw new Error("No tree");

                let results = data.tree.filter(f => 
                    f.type === 'blob' && 
                    !f.path.includes('.git/') &&
                    f.path.toLowerCase().includes(query.toLowerCase())
                );
                
                const searchFiles = results.map(f => ({
                    name: f.path.split('/').pop(),
                    path: f.path,
                    type: 'file',
                    size: f.size,
                    download_url: `https://raw.githubusercontent.com/${username}/${rootRepo}/main/${f.path}`
                }));

                renderFiles(searchFiles);
            } catch(e) {
                document.getElementById("file-container").innerHTML = '<div class="empty-state">Ошибка при глобальном поиске.</div>';
            }
        }

        // Web Share API функция
        async function shareFile(name, url, event) {
            if (event) event.stopPropagation();
            
            if (navigator.share) {
                try {
                    await navigator.share({
                        title: name,
                        text: `Файл из облака: ${name}`,
                        url: url
                    });
                } catch (err) {
                    console.log("Отмена шаринга.");
                }
            } else {
                try {
                    await navigator.clipboard.writeText(url);
                    alert("Ссылка скопирована в буфер обмена!");
                } catch (err) {
                    console.error("Ошибка копирования:", err);
                }
            }
        }

        function renderFiles(filesToRender) {
            const container = document.getElementById("file-container");
            container.innerHTML = "";
            
            if (filesToRender.length === 0) {
                container.innerHTML = '<div class="empty-state">Ничего не найдено.</div>';
                return;
            }

            filesToRender.forEach(file => {
                const item = document.createElement("div");
                item.className = "file-item" + (file.type === 'dir' ? " is-dir" : "");
                
                const isDir = file.type === "dir";
                const icon = isDir ? "📁" : getFileIcon(file.name);
                
                let sizeText = "";
                if (!isDir && file.size) {
                    const kb = file.size / 1024;
                    sizeText = kb > 1024 ? (kb / 1024).toFixed(1) + " MB" : kb.toFixed(1) + " KB";
                }

                item.onclick = (e) => {
                    if (isDir) loadPath(file.path);
                    else openPreview(file.name, file.download_url);
                };

                const actionBtnHtml = !isDir 
                    ? `<button class="primary-btn" onclick="shareFile('${file.name}', '${file.download_url}', event)">🔗 Поделиться</button>` 
                    : ``;

                if (currentViewMode === 'list') {
                    item.innerHTML = `
                        <div class="file-name"><span class="file-icon">${icon}</span>${file.name}</div>
                        <div class="file-actions">
                            ${isDir ? `<span class="file-size" style="font-weight:700;">Папка</span>` : `<span class="file-size">${sizeText}</span>`}
                            <div class="action-buttons">${actionBtnHtml}</div>
                        </div>
                    `;
                } else {
                    item.innerHTML = `
                        <div class="file-icon">${icon}</div>
                        <div class="file-name">${file.name}</div>
                        ${!isDir ? `<div class="file-size">${sizeText}</div>` : ''}
                        ${!isDir ? `<div class="action-buttons">${actionBtnHtml}</div>` : ''}
                    `;
                }
                container.appendChild(item);
            });
        }

        function updateBreadcrumbs() {
            const crumbs = document.getElementById("breadcrumbs");
            crumbs.innerHTML = "";
            
            const parts = currentPath.split('/');
            let buildPath = "";
            
            parts.forEach((part, index) => {
                if (index > 0) buildPath += "/";
                buildPath += part;
                
                const span = document.createElement("span");
                span.className = "breadcrumb-item";
                span.textContent = index === 0 ? "🏠 " + rootRepo : part;
                
                const pathSnapshot = buildPath;
                span.onclick = () => {
                    document.getElementById('search-input').value = ""; 
                    loadPath(pathSnapshot);
                };
                
                crumbs.appendChild(span);
                
                if (index < parts.length - 1) {
                    const sep = document.createElement("span");
                    sep.className = "separator";
                    sep.textContent = " / ";
                    crumbs.appendChild(sep);
                }
            });
        }

        function setViewMode(mode) {
            currentViewMode = mode;
            document.getElementById('btn-grid').className = mode === 'grid' ? 'view-btn active' : 'view-btn';
            document.getElementById('btn-list').className = mode === 'list' ? 'view-btn active' : 'view-btn';
            document.getElementById('file-container').className = `file-container ${mode}-view`;
            const isSearching = document.getElementById('search-input').value.trim() !== "";
            if (!isSearching) renderFiles(allFiles);
            else handleSearch(document.getElementById('search-input').value.trim());
        }

        function getFileIcon(filename) {
            const ext = filename.split('.').pop().toLowerCase();
            const icons = {
                'jpg': '🖼️', 'jpeg': '🖼️', 'png': '🖼️', 'gif': '🖼️', 'webp': '🖼️',
                'mp4': '🎞️', 'avi': '🎞️', 'mov': '🎞️',
                'mp3': '🎵', 'wav': '🎵',
                'pdf': '📕',
                'zip': '📦', 'rar': '📦', '7z': '📦',
                'txt': '📝', 'md': '📝', 'json': '⚙️', 'py': '🐍', 'js': '📜', 'html': '🌐'
            };
            return icons[ext] || '📄';
        }

        async function openPreview(name, url) {
            const modal = document.getElementById('preview-modal');
            document.getElementById('modal-title').textContent = name;
            const body = document.getElementById('modal-body');
            const footer = document.getElementById('modal-footer');
            
            body.innerHTML = '<div class="empty-state" style="padding: 20px;">Загрузка файла...</div>';
            
            footer.innerHTML = `
                <button class="primary-btn" style="padding: 12px 30px; font-size:15px;" onclick="shareFile('${name}', '${url}', event)">🔗 Поделиться ссылкой</button>
            `;
            modal.style.display = 'flex';

            const ext = name.split('.').pop().toLowerCase();
            
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
                body.innerHTML = `<img src="${url}" alt="${name}">`;
            } else if (['mp4', 'webm', 'ogg'].includes(ext)) {
                body.innerHTML = `<video controls autoplay><source src="${url}" type="video/${ext}"></video>`;
            } else if (['txt', 'md', 'json', 'py', 'js', 'html', 'css', 'csv'].includes(ext)) {
                try {
                    const res = await fetch(url);
                    const text = await res.text();
                    body.innerHTML = `<pre>${escapeHtml(text)}</pre>`;
                } catch (e) {
                    body.innerHTML = '<div class="empty-state">Ошибка загрузки текста.</div>';
                }
            } else {
                body.innerHTML = `<div class="empty-state" style="padding: 30px;">Предпросмотр недоступен для формата .${ext.toUpperCase()}</div>`;
            }
        }

        function closeModal() {
            document.getElementById('preview-modal').style.display = 'none';
            document.getElementById('modal-body').innerHTML = ""; 
        }

        function escapeHtml(unsafe) {
            return unsafe.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
