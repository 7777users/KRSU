name: Проверка и публикация сайта

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Получить репозиторий
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Настроить Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Проверить проект
        run: npm test

      - name: Собрать сайт
        run: npm run build

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v6

      - name: Подготовить файлы публикации
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать сайт
        id: deployment
        uses: actions/deploy-pages@v5
